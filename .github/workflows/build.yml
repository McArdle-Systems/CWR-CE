name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
  CCACHE_NOHASHDIR: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  DEMO_ASSETS_URL: https://files.ofpisnotdead.com/CWR-demo-assets-v2.zip
  CWR_ARTIFACT_PREFIX: Linux-x64-rwdi
  TRIDENT_RENDER: gl33
  TRIDENT_AUDIO: openal
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  CTEST_OUTPUT_ON_FAILURE: 1
  TRIDENT_XVFB_ARGS: -screen 0 1920x1080x24

jobs:
  build-linux:
    name: Linux RelWithDebInfo
    runs-on: ubuntu-24.04
    env:
      CWR_PRESET: linux-x64-clang-rwdi
      CWR_VCPKG_TRIPLET: x64-linux-clang
      CWR_BUILD_DIR: build/linux-x64-clang-rwdi
      # STRINGTABLE_MAP/EQUIPMENT/equipment.utf8.html cases need real
      # localization assets from packages/Remastered/, which is gitignored and
      # not present on this hosted runner (see the [external-data] note on
      # build-cwr-arm64's matrix below, which excludes the same tests for
      # the same reason on its own hosted/non-real-data legs).
      CWR_CTEST_EXCLUDE: 'PoseidonTests - (OAL -|STRINGTABLE_MAP\.utf8\.csv ships both legend keys with English fallbacks|STRINGTABLE_EQUIPMENT\.utf8\.csv ships M16 keys for all 8 languages|equipment\.utf8\.html lives loose and references STR_EQ_M16 tokens|equipment\.utf8\.html line endings are clean CRLF \(no doubled CR\)|equipment\.utf8\.html preserves every EQ_ anchor and weapon image)'
      CWR_DIST_DIR: dist/x64-linux-rwdi
      CWR_ARTIFACT_PREFIX: Linux-x64-rwdi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build metadata
        id: build_metadata
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        uses: ./.github/actions/build-cwr
        with:
          preset: ${{ env.CWR_PRESET }}
          vcpkg-triplet: ${{ env.CWR_VCPKG_TRIPLET }}
          build-dir: ${{ env.CWR_BUILD_DIR }}
          ctest-exclude: ${{ env.CWR_CTEST_EXCLUDE }}

      - name: Upload Game
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Game-${{ steps.build_metadata.outputs.sha_short }}
          path: ${{ env.CWR_DIST_DIR }}/PoseidonGame
          if-no-files-found: error

      - name: Upload GameDemo
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-GameDemo-${{ steps.build_metadata.outputs.sha_short }}
          path: ${{ env.CWR_DIST_DIR }}/PoseidonGameDemo
          if-no-files-found: error

      - name: Upload Server
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Server-${{ steps.build_metadata.outputs.sha_short }}
          path: ${{ env.CWR_DIST_DIR }}/PoseidonServer
          if-no-files-found: error

  build-windows:
    name: Windows RelWithDebInfo
    runs-on: windows-2022
    env:
      CWR_PRESET: win-x64-clang-rwdi
      CWR_VCPKG_TRIPLET: x64-windows-clang
      CWR_BUILD_DIR: build/win-x64-clang-rwdi
      # See build-linux's CWR_CTEST_EXCLUDE comment re: STRINGTABLE_MAP/
      # EQUIPMENT/equipment.utf8.html needing real data not present here.
      CWR_CTEST_EXCLUDE: 'PoseidonTests - (OAL -|PAAEncoder -|Image - Save to \.paa|World state file format --|PreviewImage - saveToFile writes|PreviewImageRGB - saveToFile writes|STRINGTABLE_MAP\.utf8\.csv ships both legend keys with English fallbacks|STRINGTABLE_EQUIPMENT\.utf8\.csv ships M16 keys for all 8 languages|equipment\.utf8\.html lives loose and references STR_EQ_M16 tokens|equipment\.utf8\.html line endings are clean CRLF \(no doubled CR\)|equipment\.utf8\.html preserves every EQ_ anchor and weapon image)'
      CWR_DIST_DIR: dist/x64-win-rwdi
      CWR_ARTIFACT_PREFIX: Windows-x64-rwdi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build metadata
        id: build_metadata
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        uses: ./.github/actions/build-cwr
        with:
          preset: ${{ env.CWR_PRESET }}
          vcpkg-triplet: ${{ env.CWR_VCPKG_TRIPLET }}
          build-dir: ${{ env.CWR_BUILD_DIR }}
          ctest-exclude: ${{ env.CWR_CTEST_EXCLUDE }}

      - name: Upload Game
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Game-${{ steps.build_metadata.outputs.sha_short }}
          path: |
            ${{ env.CWR_DIST_DIR }}/PoseidonGame.exe
            ${{ env.CWR_DIST_DIR }}/OpenAL32.dll
            ${{ env.CWR_DIST_DIR }}/OpenAL-Soft.LICENSE.txt
          if-no-files-found: error

      - name: Upload GameDemo
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-GameDemo-${{ steps.build_metadata.outputs.sha_short }}
          path: |
            ${{ env.CWR_DIST_DIR }}/PoseidonGameDemo.exe
            ${{ env.CWR_DIST_DIR }}/OpenAL32.dll
            ${{ env.CWR_DIST_DIR }}/OpenAL-Soft.LICENSE.txt
          if-no-files-found: error

      - name: Upload Server
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Server-${{ steps.build_metadata.outputs.sha_short }}
          path: ${{ env.CWR_DIST_DIR }}/PoseidonServer.exe
          if-no-files-found: error

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Symbols-${{ steps.build_metadata.outputs.sha_short }}
          path: |
            ${{ env.CWR_DIST_DIR }}/PoseidonGame.pdb
            ${{ env.CWR_DIST_DIR }}/PoseidonGameDemo.pdb
            ${{ env.CWR_DIST_DIR }}/PoseidonServer.pdb
          if-no-files-found: error

  trident-windows:
    name: Rust / Trident / windows-2022
    runs-on: windows-2022
    env:
      CWR_ARTIFACT_PREFIX: Windows-x64-rwdi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Build metadata
        id: build_metadata
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload Trident
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Trident-${{ steps.build_metadata.outputs.sha_short }}
          path: target/debug/tri.exe
          if-no-files-found: error

      - name: Upload MasterService
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-MasterService-${{ steps.build_metadata.outputs.sha_short }}
          path: target/debug/papa-bear-master-service.exe
          if-no-files-found: error

  trident-test-windows:
    name: Windows Trident (shard ${{ matrix.shard }})
    runs-on: windows-2022
    needs:
      - build-windows
      - trident-windows
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CWR_ARTIFACT_PREFIX: Windows-x64-rwdi
      # GitHub's hosted Windows runner exposes only Microsoft's OpenGL 1.1
      # software implementation, not enough for gl33. Mesa's llvmpipe
      # (software rasterizer, no GPU needed) is installed below to get a
      # real GL 3.3+ context, the same trick Linux CI uses via Xvfb+Mesa.
      TRIDENT_RENDER: gl33
      GALLIUM_DRIVER: llvmpipe
      MESA_VERSION: 26.2.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download demo game data
        uses: ./.github/actions/download-extract
        with:
          url: ${{ env.DEMO_ASSETS_URL }}
          path: packages/Demo
          archive-name: CWR-demo-assets.zip

      - name: Build metadata
        id: build_metadata
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download Game
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Game-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Download GameDemo
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-GameDemo-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Download Server
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Server-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Download Trident
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Trident-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Download MasterService
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-MasterService-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Install Mesa software OpenGL (llvmpipe)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          # opengl32.dll next to the exe wins Windows' DLL search order over
          # the system one; libgallium_wgl.dll is the actual driver it loads.
          # No libglapi.dll needed -- Mesa dropped it as of 25.0.0.
          7z e mesa.7z -oexe x64/opengl32.dll x64/libgallium_wgl.dll -y
          Remove-Item mesa.7z

      - name: Write Trident env
        shell: pwsh
        run: |
          Copy-Item .trident.env.example .trident.env
          (Get-Content .trident.env) `
            -replace '^OFPR_GAME_DIR=.*', 'OFPR_GAME_DIR=exe' `
            -replace '^OFPR_DATA_DIR=.*', 'OFPR_DATA_DIR=packages/Demo' |
            Set-Content .trident.env

      - name: Run Trident tests
        shell: pwsh
        env:
          ALSOFT_DRIVERS: 'null'
          HARNESS_CMD_TIMEOUT_SEC: '180'
          PAPA_BEAR_MASTER_SERVICE: ${{ github.workspace }}\exe\papa-bear-master-service.exe
          TRI_OUTPUT_DIR: ${{ github.workspace }}\trident-output
        run: |
          exe/tri.exe test `
            --output-dir "$env:TRI_OUTPUT_DIR" `
            --render "$env:TRIDENT_RENDER" `
            --tag headless `
            --shard ${{ matrix.shard }}/4 `
            --retries 2 `
            --skip-tag ci-host-blocked `
            --game-arg --audio `
            --game-arg "$env:TRIDENT_AUDIO" `
            --game-arg --no-strict `
            tests/integration

      - name: Upload Trident output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trident-output-windows-${{ steps.build_metadata.outputs.sha_short }}-shard${{ matrix.shard }}
          path: trident-output
          if-no-files-found: ignore

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    name: macOS ${{ matrix.arch }} RelWithDebInfo
    runs-on: macos-latest
    env:
      CWR_PRESET: macos-${{ matrix.arch }}-clang-rwdi
      CWR_VCPKG_TRIPLET: ${{ matrix.arch }}-macos-clang
      CWR_BUILD_DIR: build/macos-${{ matrix.arch }}-clang-rwdi
      CWR_CTEST_EXCLUDE: 'PoseidonTests - (STRINGTABLE_MAP\.utf8\.csv ships both legend keys with English fallbacks|STRINGTABLE_EQUIPMENT\.utf8\.csv ships M16 keys for all 8 languages|equipment\.utf8\.html lives loose and references STR_EQ_M16 tokens|equipment\.utf8\.html line endings are clean CRLF \(no doubled CR\)|equipment\.utf8\.html preserves every EQ_ anchor and weapon image)|PoseidonFoundationTests - potime - (Poseidon - Foundation - getSystemTime timing accuracy|Common usage patterns|Platform consistency|SLEEP_MS macro)'
      CWR_DIST_DIR: dist/macos-${{ matrix.arch }}-clang-rwdi
      CWR_ARTIFACT_PREFIX: macOS-${{ matrix.arch }}-rwdi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install macOS dependencies
        run: brew install clang-format

      - name: Verify macOS dependencies
        run: |
          command -v clang-format
          command -v pkg-config
          command -v xcodebuild

      - name: Build metadata
        id: build_metadata
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        uses: ./.github/actions/build-cwr
        with:
          preset: ${{ env.CWR_PRESET }}
          vcpkg-triplet: ${{ env.CWR_VCPKG_TRIPLET }}
          build-dir: ${{ env.CWR_BUILD_DIR }}
          ctest-exclude: ${{ env.CWR_CTEST_EXCLUDE }}

      - name: Upload Game
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Game-${{ steps.build_metadata.outputs.sha_short }}
          path: |
            ${{ env.CWR_DIST_DIR }}/PoseidonGame
            ${{ env.CWR_DIST_DIR }}/libopenal*.dylib
          if-no-files-found: error

      - name: Upload GameDemo
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-GameDemo-${{ steps.build_metadata.outputs.sha_short }}
          path: |
            ${{ env.CWR_DIST_DIR }}/PoseidonGameDemo
            ${{ env.CWR_DIST_DIR }}/libopenal*.dylib
          if-no-files-found: error

      - name: Upload Server
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Server-${{ steps.build_metadata.outputs.sha_short }}
          path: ${{ env.CWR_DIST_DIR }}/PoseidonServer
          if-no-files-found: error

  trident-macos:
    name: Rust / Trident / macos-latest
    runs-on: macos-latest
    env:
      CWR_ARTIFACT_PREFIX: macOS-arm64-rwdi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Build metadata
        id: build_metadata
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload Trident
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Trident-${{ steps.build_metadata.outputs.sha_short }}
          path: target/debug/tri
          if-no-files-found: error

      - name: Upload MasterService
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-MasterService-${{ steps.build_metadata.outputs.sha_short }}
          path: target/debug/papa-bear-master-service
          if-no-files-found: error

  trident-test-macos:
    name: macOS Trident (shard ${{ matrix.shard }})
    runs-on: macos-latest
    needs:
      - build-macos
      - trident-macos
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CWR_ARTIFACT_PREFIX: macOS-arm64-rwdi
      TRIDENT_RENDER: mtl
      # Enables EngineMTL's cached framebuffer sampling for Trident pixel
      # assertions. Ordinary game runs avoid the synchronous readback cost.
      TRIDENT_METAL_READBACK: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download demo game data
        uses: ./.github/actions/download-extract
        with:
          url: ${{ env.DEMO_ASSETS_URL }}
          path: packages/Demo
          archive-name: CWR-demo-assets.zip

      - name: Build metadata
        id: build_metadata
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download Game
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Game-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Download GameDemo
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-GameDemo-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Download Server
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Server-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Download Trident
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Trident-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Download MasterService
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-MasterService-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Write Trident env
        run: |
          chmod +x exe/*
          cp .trident.env.example .trident.env
          sed -i '' 's|^OFPR_GAME_DIR=.*|OFPR_GAME_DIR=exe|' .trident.env
          sed -i '' 's|^OFPR_DATA_DIR=.*|OFPR_DATA_DIR=packages/Demo|' .trident.env

      - name: Run Trident tests
        env:
          ALSOFT_DRIVERS: 'null'
          HARNESS_CMD_TIMEOUT_SEC: '180'
          PAPA_BEAR_MASTER_SERVICE: ${{ github.workspace }}/exe/papa-bear-master-service
          TRI_OUTPUT_DIR: ${{ github.workspace }}/trident-output
        run: |
          exe/tri test \
            --output-dir "$TRI_OUTPUT_DIR" \
            --render "$TRIDENT_RENDER" \
            --shard ${{ matrix.shard }}/4 \
            --retries 2 \
            --skip-tag ci-host-blocked \
            --skip-tag metal-known-failure \
            --skip-tag efx-required \
            --game-arg --audio \
            --game-arg "$TRIDENT_AUDIO" \
            --game-arg --no-strict \
            tests/integration

      - name: Fix Trident output permissions
        if: failure()
        run: chmod -R u+rwX trident-output || true

      - name: Upload Trident output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trident-output-macos-${{ steps.build_metadata.outputs.sha_short }}-shard${{ matrix.shard }}
          path: trident-output
          if-no-files-found: ignore

  trident-linux:
    name: Rust / Trident / ubuntu-24.04
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: Build
        run: cargo build --locked

      - name: Build metadata
        id: build_metadata
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload Trident
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Trident-${{ steps.build_metadata.outputs.sha_short }}
          path: target/debug/tri
          if-no-files-found: error

      - name: Upload MasterService
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-MasterService-${{ steps.build_metadata.outputs.sha_short }}
          path: target/debug/papa-bear-master-service
          if-no-files-found: error

      - name: Test
        run: cargo test --locked

  trident-test-linux:
    name: Linux Trident (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    needs:
      - build-linux
      - trident-linux
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download demo game data
        uses: ./.github/actions/download-extract
        with:
          url: ${{ env.DEMO_ASSETS_URL }}
          path: packages/Demo
          archive-name: CWR-demo-assets-v2.zip

      - name: Install Linux runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libopengl0 \
            libx11-6 \
            libxext6 \
            libxrandr2 \
            libxcursor1 \
            libxi6 \
            libxtst6 \
            libxinerama1 \
            libxkbcommon0 \
            libwayland-client0 \
            libopenal1 \
            alsa-utils \
            mesa-utils \
            openbox \
            pulseaudio-utils \
            x11-utils \
            x11-xserver-utils \
            xvfb \
            xauth

      - name: Build metadata
        id: build_metadata
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download Game
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Game-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Download GameDemo
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-GameDemo-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Download Server
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Server-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Download Trident
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Trident-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Download MasterService
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-MasterService-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Write Trident env
        run: |
          chmod +x exe/*
          cp .trident.env.example .trident.env
          sed -i 's|^OFPR_GAME_DIR=.*|OFPR_GAME_DIR=exe|' .trident.env
          sed -i 's|^OFPR_DATA_DIR=.*|OFPR_DATA_DIR=packages/Demo|' .trident.env

      - name: Run Trident tests
        env:
          ALSOFT_DRIVERS: 'null'
          HARNESS_CMD_TIMEOUT_SEC: '180'
          PAPA_BEAR_MASTER_SERVICE: ${{ github.workspace }}/exe/papa-bear-master-service
          TRI_OUTPUT_DIR: ${{ github.workspace }}/trident-output
        run: |
          xvfb-run -a --server-args="$TRIDENT_XVFB_ARGS" \
            bash -c 'openbox & trap "kill $!" EXIT; sleep 1; exec "$@"' bash \
            exe/tri test \
            --output-dir "$TRI_OUTPUT_DIR" \
            --render "$TRIDENT_RENDER" \
            --jobs 2 \
            --shard ${{ matrix.shard }}/4 \
            --retries 2 \
            --skip-tag ci-host-blocked \
            --game-arg --audio \
            --game-arg "$TRIDENT_AUDIO" \
            --game-arg --no-strict \
            tests/integration

      - name: Fix Trident output permissions
        # Game-spawned instance dirs under trident-output (e.g. a server's
        # temp mission-bank dir) can end up without traversal/read bits for
        # the runner's own user, which fails the upload step below with
        # EACCES even though it's the same user throughout the job.
        if: failure()
        run: chmod -R u+rwX trident-output || true

      - name: Upload Trident output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trident-output-${{ steps.build_metadata.outputs.sha_short }}-shard${{ matrix.shard }}
          path: trident-output
          if-no-files-found: ignore

  steamrt4:
    name: SteamRT4 Release
    runs-on: ubuntu-24.04
    env:
      STEAMRT4_PRESET: linux-x64-steamrt4
      STEAMRT4_VCPKG_TRIPLET: x64-linux-clang
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build SteamRT4 SDK image
        uses: docker/build-push-action@v6
        with:
          context: docker/steamrt4
          load: true
          tags: cwr-steamrt4:latest
          cache-from: type=gha,scope=steamrt4-sdk
          cache-to: type=gha,mode=max,scope=steamrt4-sdk

      - name: Restore SteamRT4 compiler cache
        uses: actions/cache@v4
        with:
          path: tmp/steamrt4-ccache
          key: ccache-SteamRT4-${{ env.STEAMRT4_PRESET }}-${{ github.sha }}
          restore-keys: |
            ccache-SteamRT4-${{ env.STEAMRT4_PRESET }}-

      - name: Restore SteamRT4 vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-bincache/${{ env.STEAMRT4_VCPKG_TRIPLET }}
          key: vcpkg-SteamRT4-${{ env.STEAMRT4_VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-triplets/**', 'cmake/vcpkg-overlay-ports/**') }}
          restore-keys: |
            vcpkg-SteamRT4-${{ env.STEAMRT4_VCPKG_TRIPLET }}-

      - name: Build inside SteamRT4 container
        run: |
          set -o pipefail
          mkdir -p \
            "${{ github.workspace }}/tmp/steamrt4-ccache" \
            "${{ github.workspace }}/.vcpkg-bincache/${{ env.STEAMRT4_VCPKG_TRIPLET }}"
          docker run --rm \
            -e OFPR_TARGETS=all \
            -e VCPKG_BINARY_SOURCES="clear;files,/work/ofpr/.vcpkg-bincache/${{ env.STEAMRT4_VCPKG_TRIPLET }},readwrite" \
            -e VCPKG_DEFAULT_BINARY_CACHE="/work/ofpr/.vcpkg-bincache/${{ env.STEAMRT4_VCPKG_TRIPLET }}" \
            -e VCPKG_DEFAULT_TRIPLET="${{ env.STEAMRT4_VCPKG_TRIPLET }}" \
            -v "${{ github.workspace }}:/work/ofpr" \
            cwr-steamrt4:latest 2>&1 | tee steamrt4-build.log

      - name: Upload SteamRT4 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steamrt4-build-log
          path: steamrt4-build.log

  build-cwr-arm64:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    # The self-hosted-macOS-labeled matrix entries (macOS + iOS Device) share a
    # single physical self-hosted runner, so they need to queue behind each
    # other -- but the group must vary per *workflow run* (github.run_id), not
    # be a single global literal, or a newer run's queued job cancels an older
    # run's still-queued job from an entirely unrelated PR/branch/push (only
    # one pending job per concurrency group is ever kept, even with
    # cancel-in-progress: false -- that only protects an already-*running*
    # job, not one still waiting for the runner).
    concurrency:
      group: ${{ (contains(matrix.os, 'self-hosted') && contains(matrix.os, 'macOS')) && format('cwr-arm64-self-hosted-macos-{0}', github.run_id) || format('cwr-arm64-{0}-{1}', github.run_id, matrix.name) }}
      cancel-in-progress: false

    # The self-hosted macOS leg is a supplementary, real-data-backed check --
    # its result doesn't gate the workflow. The build-macos job above is the
    # fast, always-available required signal for macOS.
    continue-on-error: ${{ matrix.optional == true }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # [external-data] tests under PoseidonTests read real localization
          # assets (equipment.utf8.html, STRINGTABLE_MAP.utf8.csv,
          # STRINGTABLE_EQUIPMENT.utf8.csv) from packages/Remastered/, which is
          # gitignored and not distributed to the GitHub-hosted runners by
          # design. The self-hosted runners have the real data staged
          # outside the checkout path (see "Stage Remastered test data" below)
          # and run these for real; the dedicated hosted jobs exclude them.
          - name: Linux (self-hosted) RelWithDebInfo
            os: [self-hosted, debian-13, x64]
            preset: linux-x64-clang-rwdi
            vcpkg_triplet: x64-linux-clang
            build_dir: build/linux-x64-clang-rwdi
            build_target: ''
          # Supplementary check against the real (non-excluded) Remastered data
          # and a real GPU/Metal smoke test, on the single physical
          # self-hosted Mac -- optional (continue-on-error above) so it never
          # blocks on the shared-runner queue; treat a failure here as a real
          # signal worth investigating, just not a merge gate.
          - name: macOS (Apple Silicon, self-hosted, real data) RelWithDebInfo
            os: [self-hosted, macOS, arm64]
            preset: macos-arm64-clang-rwdi
            vcpkg_triplet: arm64-macos-clang
            build_dir: build/macos-arm64-clang-rwdi
            build_target: ''
            optional: true
            # No ctest_exclude: real-time OpenAL playback tests (LastLoop,
            # streamed LastLoop, streamed OGG restart) used to hang forever
            # here -- AL_SEC_OFFSET never advanced even with AL_PLAYING and
            # zero AL error, because this runner has no active interactive
            # session (`pmset -g assertions` shows UserIsActive=0; kept awake
            # by caffeinate only, and macOS withholds real-time audio I/O
            # from non-interactive sessions). Fixed below by wrapping the
            # Test step in `caffeinate -u`, which asserts UserIsActive
            # directly -- confirmed against a standalone AL_SEC_OFFSET poll
            # (stuck at 0 unwrapped, advances normally under caffeinate -u).
          - name: iOS Device Debug
            os: [self-hosted, macOS, arm64]
            preset: ios-arm64-device
            vcpkg_triplet: arm64-ios
            build_dir: build/ios-arm64-device
            build_target: PoseidonGame
            xcode: true
            skip_tests: true
          # Windows is deliberately not in this matrix: build-windows above
          # already covers it on the same GitHub-hosted windows-2022 image,
          # and there's no self-hosted Windows runner to justify a second,
          # duplicate leg here (unlike Linux, where the self-hosted entry
          # above is a real second runner, not a duplicate of build-linux).

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # packages/ is gitignored and actions/checkout's clean:true wipes it
      # (git clean -ffdx removes ignored files too) at the start of every
      # run, so the real data lives outside the checkout at
      # ~/ci-data/Remastered and gets relinked in here each time. The data is
      # staged at that location on both self-hosted runners.
      - name: Stage Remastered test data
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p packages
          ln -sfn "${HOME}/ci-data/Remastered" packages/Remastered

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          # python3-venv: vcpkg's libsystemd port (a transitive dependency
          # pulled in once the newer builtin-baseline landed) needs it to
          # build from source. GitHub's hosted Ubuntu image ships it by
          # default; this self-hosted Debian box doesn't.
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            autoconf-archive \
            gettext \
            autopoint \
            automake \
            ca-certificates \
            clang \
            clang-format \
            curl \
            libtool \
            make \
            perl \
            pkg-config \
            tar \
            zip \
            libgl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libopenal-dev \
            wayland-protocols \
            ccache \
            unzip \
            python3-venv

      - name: Verify macOS dependencies
        if: runner.os == 'macOS'
        run: |
          command -v brew
          command -v cmake
          command -v ninja
          command -v ccache
          command -v clang
          command -v clang++
          command -v clang-format
          command -v pkg-config
          command -v xcodebuild

      - name: Configure self-hosted compiler cache
        if: runner.environment == 'self-hosted' && runner.os != 'Windows'
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache/${{ matrix.preset }}"
          mkdir -p "$CCACHE_DIR"
          if [ "${{ runner.os }}" = "macOS" ]; then
            current_clang="$(xcrun clang --version | head -n 1)"
            clang_stamp="$CCACHE_DIR/.xcode-clang-version"
            echo "CCACHE_COMPILERCHECK=string:$current_clang" >> "$GITHUB_ENV"
            if [ ! -f "$clang_stamp" ] || [ "$(cat "$clang_stamp")" != "$current_clang" ]; then
              echo "Xcode/clang changed; clearing ccache for ${{ matrix.preset }}"
              ccache --clear
              printf '%s\n' "$current_clang" > "$clang_stamp"
            fi
          fi
          ccache --set-config=max_size=1G
          ccache --zero-stats
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"

      - name: Setup CMake and Ninja
        if: runner.os != 'macOS'
        uses: lukka/get-cmake@latest

      - name: Show toolchain versions
        if: runner.os != 'Windows'
        run: |
          cmake --version
          ninja --version
          ccache --version
          clang --version
          clang++ --version
          if [ "${{ runner.os }}" = "Linux" ]; then
            pkg-config --modversion openal
            /sbin/ldconfig -p | grep -E 'libopenal\.so(\.1)?'
          fi

      - name: Clear macOS precompiled headers
        if: runner.environment == 'self-hosted' && runner.os == 'macOS'
        run: |
          xcrun clang --version | head -n 1
          build_dirs=(
            "${{ matrix.build_dir }}"
            "build/macos-arm64-clang-rwdi"
            "build/ios-arm64-device"
          )

          for build_dir in "${build_dirs[@]}"; do
            echo "Clearing CMake precompiled headers in $build_dir"
            find "$build_dir" -name '*.pch' -delete 2>/dev/null || true
          done

      - name: Configure self-hosted vcpkg binary cache
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "$HOME/.cache/vcpkg-bincache/${{ matrix.vcpkg_triplet }}"
          mkdir -p .vcpkg-bincache
          rm -rf ".vcpkg-bincache/${{ matrix.vcpkg_triplet }}"
          ln -s "$HOME/.cache/vcpkg-bincache/${{ matrix.vcpkg_triplet }}" ".vcpkg-bincache/${{ matrix.vcpkg_triplet }}"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-bincache/${{ matrix.vcpkg_triplet }},readwrite
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-bincache/${{ matrix.vcpkg_triplet }}
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg_triplet }}
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}/${{ matrix.build_dir }}/vcpkg_installed
          VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/cmake/vcpkg-overlay-ports
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/cmake/vcpkg-triplets
        with:
          vcpkgDirectory: ${{ runner.tool_cache }}/vcpkg
          vcpkgGitCommitId: 170bd3bfb152a1795b67b5c2190ab7d899fc9971
          runVcpkgInstall: true
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure
        if: matrix.xcode != true && runner.environment == 'self-hosted'
        run: >
          cmake
          --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure Xcode
        if: matrix.xcode == true
        run: >
          cmake
          --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        if: matrix.build_target == ''
        run: cmake --build ${{ matrix.build_dir }}

      - name: Build target
        if: matrix.build_target != '' && matrix.xcode != true
        run: cmake --build ${{ matrix.build_dir }} --target ${{ matrix.build_target }}

      - name: Build Xcode target
        if: matrix.build_target != '' && matrix.xcode == true
        run: >
          cmake --build ${{ matrix.build_dir }}
          --target ${{ matrix.build_target }}
          --
          -quiet
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Test
        if: runner.os != 'Windows' && matrix.skip_tests != true
        env:
          CTEST_EXCLUDE: ${{ matrix.ctest_exclude }}
          ALSOFT_DRIVERS: ${{ runner.os == 'Linux' && 'null' || '' }}
        run: |
          # macOS withholds real-time CoreAudio render callbacks from a
          # session without UserIsActive asserted, which otherwise hangs the
          # OAL tests that wait on real elapsed playback time (see the matrix
          # comment above). .github/scripts/caffeinate-user-active.sh keeps
          # that asserted for exactly as long as ctest runs, however long
          # that is -- see its header comment for why a plain `caffeinate -u`
          # wrap isn't enough. No-op on Linux (caffeinate doesn't exist
          # there; unneeded anyway).
          if [ "${{ runner.os }}" = "macOS" ]; then
            RUNNER=".github/scripts/caffeinate-user-active.sh"
          else
            RUNNER=""
          fi
          if [ -z "${CTEST_EXCLUDE}" ]; then
            ${RUNNER} ctest --test-dir '${{ matrix.build_dir }}' --output-on-failure --timeout 600
          else
            ${RUNNER} ctest --test-dir '${{ matrix.build_dir }}' --output-on-failure --timeout 600 -E "${CTEST_EXCLUDE}"
          fi

      - name: Show compiler cache stats
        if: always()
        run: ccache --show-stats

      - name: Smoke test macOS renderers
        if: runner.os == 'macOS' && matrix.skip_tests != true
        run: |
          '${{ matrix.build_dir }}/apps/tools/GL33SmokeTest/GL33SmokeTest' --check
          '${{ matrix.build_dir }}/apps/tools/MetalSmokeTest/MetalSmokeTest' --check

      - name: Upload CTest logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # matrix.name keeps artifacts unique across the self-hosted legs.
          name: ctest-logs-${{ matrix.name }}
          path: ${{ matrix.build_dir }}/Testing/
          if-no-files-found: ignore
