name: C++ / Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: Lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Auto-format commits must target the contributor branch, not the
          # synthetic pull-request merge ref checked out by default.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.ref }}

      - name: Read clang-format version
        id: clang-format-version
        run: echo "version=$(tr -d '[:space:]' < .clang-format-version)" >> "$GITHUB_OUTPUT"

      - name: Setup LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ steps.clang-format-version.outputs.version }}
          arch: 'x64'

      - name: Auto-format same-repository pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          clang-format --version
          .github/scripts/clang-format.sh --fix

          if git diff --quiet; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git commit -m "Apply clang-format"
          git push

      - name: Check C++ formatting
        run: |
          clang-format --version
          .github/scripts/clang-format.sh --check
